version: '3.9'

services:
  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: dockerfile
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS_CHANNEL_LAYER=true
      - DJANGO_SETTINGS_MODULE=SignMeet.settings
    networks:
      - app-network
    command: ["daphne", "SignMeet.asgi:application", "--bind", "0.0.0.0", "--port", "8000"]

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - backend
    networks:
      - app-network
    environment:
      - VITE_BACKEND_HTTP_URL=http://backend:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

networks:
  app-network:
    driver: bridge
