version: '3.9'

services:
  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS_CHANNEL_LAYER=true
    command: ["python", "backend/manage.py", "runserver", "0.0.0.0:8000"]

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
    environment:
      - VITE_BACKEND_HTTP_URL=http://backend:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
