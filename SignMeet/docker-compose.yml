version: '3.9'

services:
  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["python", "backend/manage.py", "runserver", "0.0.0.0:8000"]